name: slr_bucket
channels:
  - conda-forge
  - defaults
dependencies:
  # ── Core runtime ───────────────────────────────────────────────────────────
  - python>=3.12
  - pip

  # ── Data / numerics ────────────────────────────────────────────────────────
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.13
  - pyarrow>=16.0          # .parquet I/O (TIPS series)
  - openpyxl>=3.1          # .xlsx I/O (CIP, UST SF raw files)

  # ── Econometrics ───────────────────────────────────────────────────────────
  - statsmodels>=0.14      # OLS + Newey-West HAC covariance

  # ── Visualisation ──────────────────────────────────────────────────────────
  - matplotlib>=3.9

  # ── Pipeline automation ────────────────────────────────────────────────────
  - doit>=0.36             # task runner (dodo.py)

  # ── Testing ────────────────────────────────────────────────────────────────
  - pytest>=9.0

  # ── Jupyter (optional — for notebooks/metric_analysis.ipynb) ───────────────
  - ipykernel>=6.0
  - jupyter_client>=8.0

  # ── pip-only packages (not on conda-forge) ─────────────────────────────────
  - pip:
    - nbimporter>=0.3      # import across notebooks (optional)
